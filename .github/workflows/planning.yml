name: Planning consistency

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'docs/agency/**'
      - 'scripts/agency/**'
      - '.github/workflows/planning.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/agency/**'
      - 'scripts/agency/**'
      - '.github/workflows/planning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/agency/plan.py check

# Application build/test CI is a Phase 0 deliverable. This check cannot certify it.
